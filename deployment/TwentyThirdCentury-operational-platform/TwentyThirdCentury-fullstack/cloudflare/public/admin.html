<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090e1d"><title>Community moderation · TwentyThirdCentury</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body{min-height:100vh;background:#090e1d;color:#eef1ff}.admin-wrap{width:min(980px,calc(100% - 36px));margin:70px auto}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:28px}.admin-head h1{font-size:clamp(28px,5vw,44px);margin:8px 0}.admin-note,.report-meta{color:#98a5c6;font-size:13px;line-height:1.7}.report-list{display:grid;gap:14px}.report{background:#121a2e;border:1px solid #ffffff18;border-radius:14px;padding:20px}.report h2{font-size:17px;margin:8px 0}.report p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}.report-actions{display:flex;gap:10px;flex-wrap:wrap}.report-actions button{border:1px solid #ffffff30;border-radius:8px;padding:9px 13px;background:#ffffff0b;color:#eee;cursor:pointer}.report-actions button.hide{border-color:#ff8b9c66;color:#ffc0c9}.empty{padding:30px;text-align:center;border:1px dashed #ffffff30;border-radius:12px;color:#9aa7c8}.status{min-height:24px;color:#9ddbd3}.admin-toplink{color:#c4b6ff}
  </style>
</head>
<body>
  <main class="admin-wrap">
    <div class="admin-head"><div><div class="eyebrow">TWENTYTHIRDCENTURY · TRUST & SAFETY</div><h1>Community review</h1><p class="admin-note">Review member reports. Hiding a post removes it from the public community feed.</p></div><a class="admin-toplink" href="/">← Back to the platform</a></div>
    <p id="status" class="status" role="status">Checking administrator access…</p>
    <section id="reports" class="report-list" aria-live="polite"></section>
  </main>
  <script src="/admin.js" defer></script>
</body>
</html>
